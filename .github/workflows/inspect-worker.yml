name: Remove legacy IntentSpider redirect
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch only the live Worker redirect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/intentspider-state-api';
          const sha=s=>createHash('sha256').update(s).digest('hex');
          async function readWorker(){
            const res=await fetch(endpoint,{headers});
            if(!res.ok) throw Error('Worker download HTTP '+res.status);
            const form=await res.formData();
            const entries=[...form.entries()];
            if(entries.length!==1 || entries[0][0]!=='worker.js') throw Error('Unexpected Worker module layout; no change made');
            const value=entries[0][1];
            return typeof value==='string'?value:await value.text();
          }
          async function settings(){
            const res=await fetch(endpoint+'/settings',{headers});
            if(!res.ok) throw Error('Cannot inspect existing settings: '+res.status);
            const data=await res.json();
            if(!data.success) throw Error('Cannot inspect existing settings');
            return sha(JSON.stringify(data.result));
          }
          const orig=await readWorker();
          const pattern=/^([ \t]*)if \(requestOrigin === "https:\/\/intentspider\.github\.io"\) \{[\s\S]*?^\1\}[ \t]*\r?\n/m;
          const match=orig.match(pattern);
          if(!match || !match[0].includes('redirectMarkup') || !match[0].includes('location.replace') || !match[0].includes('modules: redirectMarkup') || !match[0].includes('return new Response') || match[0].length>2500) throw Error('Expected exact redirect block not found; no change made');
          const patched=orig.slice(0,match.index)+orig.slice(match.index+match[0].length);
          if(patched.includes('redirectMarkup') || patched.includes('location.replace')) throw Error('Additional redirect logic found; no change made');
          console.log('Removing only legacy redirect block:',match[0].split('\n').length-1,'lines');
          console.log('Original SHA256',sha(orig),'Patched SHA256',sha(patched));
          writeFileSync('/tmp/intent-patched.mjs',patched);
          execFileSync(process.execPath,['--check','/tmp/intent-patched.mjs']);
          const priorSettings=await settings();
          if(await readWorker()!==orig) throw Error('Live source changed concurrently; no change made');
          const form=new FormData();
          form.append('metadata',new Blob([JSON.stringify({main_module:'worker.js'})],{type:'application/json'}));
          form.append('worker.js',new Blob([patched],{type:'application/javascript+module'}),'worker.js');
          const res=await fetch(endpoint+'/content',{method:'PUT',headers,body:form});
          const data=await res.json();
          console.log('Code-only update HTTP',res.status,'success',data.success);
          if(!res.ok || !data.success) {console.log('Error codes',data.errors?.map(e=>e.code));throw Error('Worker update unsuccessful');}
          const deployed=await readWorker();
          if(deployed!==patched) throw Error('Deployed source verification mismatch');
          console.log('Deployed source matches surgical patch exactly');
          console.log('Worker settings unchanged:',priorSettings===await settings());
          for(const origin of ['https://intentspider.github.io','https://intentspider.nekshadesilva.com']){
            const result=await fetch('https://intentspiderapis.nekshadesilva.com/stats',{headers:{Origin:origin,'Cache-Control':'no-cache'}});
            const body=await result.json();
            console.log('Live verification',origin,'HTTP',result.status,'numeric modules',typeof body.modules==='number','tokens',body.tokensIndexed,'CORS',result.headers.get('access-control-allow-origin'));
            if(!result.ok || typeof body.modules!=='number') throw Error('Unexpected live stats response');
          }
          JS
